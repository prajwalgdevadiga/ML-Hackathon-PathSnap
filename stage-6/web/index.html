<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PathSnap · Route evaluation</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/assets/leaflet.css"><link rel="stylesheet" href="/assets/app.css">
<script defer src="/assets/leaflet.js"></script><script defer src="/assets/app.js"></script></head>
<body><header><div class="brand"><span class="mark" aria-hidden="true">↗</span>PathSnap</div><span id="connection" role="status">Connecting…</span></header>
<main><div class="title"><h1>Route evaluation</h1><span id="partition"></span></div>
<div class="layout"><aside><form id="trip-form"><label for="trip">Trip ID</label><select id="trip" disabled></select>
<button id="run" disabled>Reconstruct route</button></form>
<div class="metrics"><h2>Evaluation results</h2><dl>
<div><dt>Point accuracy</dt><dd id="accuracy">—</dd></div>
<div><dt>Route continuity</dt><dd id="continuity">—</dd></div>
<div><dt>Sequence F1</dt><dd id="sequence">—</dd></div>
<div><dt>Macro F1</dt><dd id="macro">—</dd></div></dl>
<p id="coverage">Select a trip and run reconstruction.</p></div>
<div id="receipt" hidden><span>Request ID</span><code id="request-id"></code></div>
</aside><section class="canvas"><div class="maphead"><h2 id="map-title">Trip map</h2><span id="timing"></span></div>
<div id="map" aria-label="Interactive world and route map"></div><div class="legend" aria-label="Map layers">
<button type="button" class="map-action" id="world-view">World view</button>
<button type="button" class="map-action" id="trip-view" disabled>Fit route</button>
<label><input type="checkbox" id="roads" checked><i class="road"></i>Road network</label>
<label><input type="checkbox" id="route" checked><i class="route"></i>Predicted route</label>
<label><input type="checkbox" id="gps" checked><i class="gps"></i>GPS points</label>
</div></section></div><p id="status" role="status" aria-live="polite"></p></main></body></html>
